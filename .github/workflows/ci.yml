name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Runs tsc -b too; the Docker image builds the same way
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Syntax errors, undefined names, unused imports and variables only
      - run: pipx run ruff==0.16.10 check --isolated --select E9,F --target-version py312 .
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: poetry
      - run: poetry install --no-root --only main
      # Imports every router and service the way uvicorn and the bot do, without credentials
      - run: poetry run python -c "import backend.app, telegram_bot"
